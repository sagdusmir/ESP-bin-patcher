name: Tag and Release

on:
  push:
    branches: [main]
    paths:
      - espbinpatch.py
      - .github/workflows/release.yaml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from script
        id: version
        run: |
          VERSION=$(python3 espbinpatch.py --version | awk '{print $NF}')
          if [ -z "$VERSION" ]; then
            echo "Could not read version from espbinpatch.py" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '${VERSION}' is not digits.digits.digits" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists. Skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} does not exist. Proceeding with release."
          fi

      - name: Build release notes from commit messages
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE=$(git rev-list --max-parents=0 HEAD)
          else
            RANGE="$PREV_TAG"
          fi
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty=format:'- %s' "${RANGE}..HEAD"
            echo
          } > release_notes.md
          cat release_notes.md

      - name: Sync web tool version and commit
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("docs/index.html")
          text = path.read_text()
          pattern = re.compile(r'^(    const VERSION = ")[^"]+(";)', re.M)
          found = len(pattern.findall(text))
          if found != 1:
              raise SystemExit(
                  f"Expected exactly one VERSION assignment, found {found}"
              )
          new, count = pattern.subn(rf"\g<1>{version}\2", text, count=1)
          if count != 1:
              raise SystemExit("Failed to replace VERSION assignment")
          path.write_text(new)
          PY
          if git diff --quiet -- docs/index.html; then
            echo "docs/index.html already at ${VERSION}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs/index.html
            git commit -m "Sync web tool version to ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md
